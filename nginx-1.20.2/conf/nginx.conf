#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
   map $http_upgrade $connection_upgrade{
	default upgrade;
	'' close;
	}

    server {
    
        listen       80;  
        server_name  lucas_yun_disk.com;
        charset utf-8;
        client_max_body_size 10240m;

        # alias 是一个指令，用于改变请求 URI 到文件系统上的文件路径的映射
        location / {
            alias E:/project/yundisk/version2/EasyPan-main/myworkspace-front/easypan-front/dist/;
            try_files $uri $uri/  /index.html;
            index  index.html index.htm;
        }

        # 反向代理,处理管理端发送的请求
        location /api {
                      proxy_pass   http://127.0.0.1:7090/api;
                      proxy_set_header x-forwarded-for   $remote_addr;
        }
    }
}